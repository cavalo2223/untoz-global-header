<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0031ff">
  <title>Untoz Global Header — V3 Preview</title>
  <link rel="stylesheet" href="src/untoz-global-header.css">
  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; color: #0b1020; background: radial-gradient(circle at 20% 0%, rgba(0,49,255,.09), transparent 35%), radial-gradient(circle at 85% 15%, rgba(89,60,235,.10), transparent 32%), #f7f8fc; }
    .demo { min-height: calc(100vh - 62px); display: grid; place-items: center; padding: 48px 20px; }
    .demo-card { width: min(760px, 100%); padding: 42px; border: 1px solid rgba(11,16,32,.08); border-radius: 28px; background: rgba(255,255,255,.72); backdrop-filter: blur(20px); box-shadow: 0 30px 90px rgba(11,16,32,.09); }
    .demo-card .eyebrow { margin: 0 0 10px; color: #0031ff; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .demo-card h1 { margin: 0 0 12px; font-size: clamp(34px, 7vw, 58px); line-height: .98; letter-spacing: -.055em; }
    .demo-card p { margin: 0; max-width: 580px; color: #687089; line-height: 1.65; }
  </style>
</head>
<body>
  <div id="untoz-global-header"></div>
  <main class="demo">
    <section class="demo-card">
      <p class="eyebrow">Untoz Design System</p>
      <h1>Global Header<br>V3.</h1>
      <p>The global navigation system for the entire Untoz ecosystem — with a full mega menu, product discovery and responsive mobile navigation.</p>
    </section>
  </main>
  <script src="src/untoz-global-header.js"></script>
  <script>
    UntozGlobalHeader.render(document.getElementById('untoz-global-header'), { site: 'untoz', active: 'untoz' });
  </script>
</body>
</html>
